<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Clone - Enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #98D8E8 50%, #B0E0E6 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            /* Vignette effect */
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 0 50px rgba(0, 0, 0, 0.1);
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 70%, #90EE90 100%);
            cursor: pointer;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-align: center;
            color: #FFD700;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            animation: titlePulse 2s ease-in-out infinite alternate;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        @keyframes titlePulse {
            from { 
                transform: scale(1); 
                text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.5);
            }
            to { 
                transform: scale(1.05); 
                text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.8);
            }
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .high-score {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .new-high-score {
            color: #FFD700;
            animation: goldPulse 0.5s ease-in-out infinite alternate;
            font-weight: bold;
        }

        @keyframes goldPulse {
            from { transform: scale(1); text-shadow: 0 0 10px #FFD700; }
            to { transform: scale(1.1); text-shadow: 0 0 20px #FFD700; }
        }

        .game-over {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .final-score {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .medal {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: medalSpin 1s ease-in-out;
        }

        @keyframes medalSpin {
            from { transform: rotate(0deg) scale(0); }
            to { transform: rotate(360deg) scale(1); }
        }

        .instructions {
            font-size: 1rem;
            text-align: center;
            opacity: 0.9;
        }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .difficulty-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }

        .screen-shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .score {
                font-size: 1.5rem;
            }
            
            .game-over {
                font-size: 2rem;
            }

            .controls {
                top: 5px;
                right: 5px;
                gap: 5px;
            }

            .control-btn {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Controls -->
        <div class="controls">
            <button class="control-btn" id="muteBtn">🔊</button>
            <button class="control-btn" id="pauseBtn">⏸️</button>
        </div>
        
        <!-- Difficulty Indicator -->
        <div class="difficulty-indicator" id="difficultyIndicator">Level 1</div>
        
        <!-- UI Overlay -->
        <div class="ui-overlay" id="uiOverlay">
            <div class="title">Flappy Bird</div>
            <div class="subtitle">Press SPACE or Click to Play</div>
            <div class="score" id="scoreDisplay" style="display: none;">Score: 0</div>
            <div class="high-score" id="highScoreDisplay" style="display: none;">High Score: 0</div>
            <div class="game-over" id="gameOverDisplay" style="display: none;">Game Over!</div>
            <div class="final-score" id="finalScoreDisplay" style="display: none;"></div>
            <div class="medal" id="medalDisplay" style="display: none;"></div>
            <div class="instructions" id="instructionsDisplay">Tap or click to jump • P to pause</div>
        </div>
        
        <!-- Pause Overlay -->
        <div class="pause-overlay" id="pauseOverlay">
            <div>PAUSED<br><small>Press P to resume</small></div>
        </div>
    </div>

    <script>
        class Bird {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocity = 0;
                this.radius = 20;
                this.rotation = 0;
                this.wingPhase = 0;
                this.jumpPower = -12;
                this.gravity = 0.8;
                this.maxVelocity = 15;
                this.rotationSpeed = 0.1;
                this.isDead = false;
                this.deathRotation = 0;
                this.deathVelocity = 0;
            }

            jump() {
                this.velocity = this.jumpPower;
            }

            die() {
                this.isDead = true;
                this.deathVelocity = this.velocity;
            }

            update() {
                if (this.isDead) {
                    // Death animation - rotate and fall
                    this.deathRotation += 0.2;
                    this.deathVelocity += this.gravity;
                    this.y += this.deathVelocity;
                    this.rotation = this.deathRotation;
                } else {
                    // Apply gravity
                    this.velocity += this.gravity;
                    this.velocity = Math.min(this.velocity, this.maxVelocity);
                    
                    // Update position
                    this.y += this.velocity;
                    
                    // Update rotation based on velocity
                    this.rotation = Math.min(Math.max(this.velocity * 0.1, -0.5), 0.5);
                }
                
                // Update wing animation
                this.wingPhase += 0.3;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(3, this.radius + 5, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Bird body (main circle) - More vibrant yellow
                const bodyGradient = ctx.createRadialGradient(-3, -3, 0, 0, 0, this.radius);
                bodyGradient.addColorStop(0, '#FFEB3B'); // Bright yellow center
                bodyGradient.addColorStop(1, '#FFD700'); // Gold edges
                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Bird body outline
                ctx.strokeStyle = '#FFA000';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Bird eye with white highlight
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(-5, -5, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-4, -4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Eye highlight
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(-3.5, -4.5, 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                // Bird beak - more orange
                ctx.fillStyle = '#FF8C00';
                ctx.beginPath();
                ctx.moveTo(this.radius - 5, 0);
                ctx.lineTo(this.radius + 12, -4);
                ctx.lineTo(this.radius + 12, 4);
                ctx.closePath();
                ctx.fill();
                
                // Beak highlight
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.moveTo(this.radius - 3, 0);
                ctx.lineTo(this.radius + 8, -2);
                ctx.lineTo(this.radius + 8, 2);
                ctx.closePath();
                ctx.fill();
                
                // Wing animation - more detailed
                const wingOffset = Math.sin(this.wingPhase) * 4;
                const wingGradient = ctx.createLinearGradient(-8, 3, 2, 8);
                wingGradient.addColorStop(0, '#FFA000');
                wingGradient.addColorStop(1, '#FF8C00');
                ctx.fillStyle = wingGradient;
                ctx.beginPath();
                ctx.ellipse(-5, 5 + wingOffset, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Wing details
                ctx.strokeStyle = '#FF8C00';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-8, 5 + wingOffset);
                ctx.lineTo(-2, 3 + wingOffset);
                ctx.moveTo(-7, 7 + wingOffset);
                ctx.lineTo(-1, 5 + wingOffset);
                ctx.stroke();
                
                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }

        class Cloud {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.speed = 0.5;
            }

            update() {
                this.x -= this.speed;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = 0.7;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                // Draw cloud as overlapping circles
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.8, this.y, this.size * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 1.6, this.y, this.size * 0.6, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.4, this.y - this.size * 0.3, this.size * 0.7, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 1.2, this.y - this.size * 0.3, this.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            isOffScreen() {
                return this.x + this.size * 2 < 0;
            }
        }

        class Pipe {
            constructor(x, gapY, gapSize, speed = 3) {
                this.x = x;
                this.gapY = gapY;
                this.gapSize = gapSize;
                this.width = 60;
                this.speed = speed;
                this.scored = false;
            }

            update() {
                this.x -= this.speed;
            }

            draw(ctx, canvasHeight) {
                // Top pipe
                const topHeight = this.gapY;
                const bottomY = this.gapY + this.gapSize;
                const bottomHeight = canvasHeight - bottomY;

                // Pipe gradient
                const topGradient = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
                topGradient.addColorStop(0, '#228B22');
                topGradient.addColorStop(1, '#32CD32');

                const bottomGradient = ctx.createLinearGradient(this.x, bottomY, this.x + this.width, bottomY);
                bottomGradient.addColorStop(0, '#228B22');
                bottomGradient.addColorStop(1, '#32CD32');

                // Draw top pipe
                ctx.fillStyle = topGradient;
                ctx.fillRect(this.x, 0, this.width, topHeight);
                
                // Draw bottom pipe
                ctx.fillStyle = bottomGradient;
                ctx.fillRect(this.x, bottomY, this.width, bottomHeight);

                // Enhanced pipe caps with 3D effect
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x - 5, topHeight - 20, this.width + 10, 20);
                ctx.fillRect(this.x - 5, bottomY, this.width + 10, 20);
                
                // Cap highlights
                ctx.fillStyle = '#00AA00';
                ctx.fillRect(this.x - 3, topHeight - 18, this.width + 6, 3);
                ctx.fillRect(this.x - 3, bottomY + 2, this.width + 6, 3);
            }

            getBounds() {
                return {
                    top: {
                        x: this.x,
                        y: 0,
                        width: this.width,
                        height: this.gapY
                    },
                    bottom: {
                        x: this.x,
                        y: this.gapY + this.gapSize,
                        width: this.width,
                        height: 1000 // Large enough to cover screen
                    }
                };
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocityX = (Math.random() - 0.5) * 4;
                this.velocityY = (Math.random() - 0.5) * 4;
                this.life = 1.0;
                this.decay = 0.02;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.life -= this.decay;
                this.velocityY += 0.1; // Gravity
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        class AudioManager {
            constructor() {
                this.audioContext = null;
                this.muted = false;
                this.initAudio();
            }

            initAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Web Audio API not supported');
                }
            }

            playTone(frequency, duration, type = 'sine') {
                if (this.muted || !this.audioContext) return;

                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = type;

                gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);

                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + duration);
            }

            playJump() {
                if (this.muted || !this.audioContext) return;

                // Create a realistic wing flap sound using multiple oscillators
                const duration = 0.08;
                const time = this.audioContext.currentTime;

                // Main flap sound - low frequency whoosh
                const flap1 = this.audioContext.createOscillator();
                const flap1Gain = this.audioContext.createGain();
                flap1.connect(flap1Gain);
                flap1Gain.connect(this.audioContext.destination);
                
                flap1.frequency.setValueAtTime(80, time);
                flap1.frequency.exponentialRampToValueAtTime(40, time + duration);
                flap1.type = 'sawtooth';
                
                flap1Gain.gain.setValueAtTime(0.15, time);
                flap1Gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                
                flap1.start(time);
                flap1.stop(time + duration);

                // Secondary flap sound - higher frequency air rush
                const flap2 = this.audioContext.createOscillator();
                const flap2Gain = this.audioContext.createGain();
                flap2.connect(flap2Gain);
                flap2Gain.connect(this.audioContext.destination);
                
                flap2.frequency.setValueAtTime(120, time);
                flap2.frequency.exponentialRampToValueAtTime(60, time + duration);
                flap2.type = 'triangle';
                
                flap2Gain.gain.setValueAtTime(0.08, time);
                flap2Gain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                
                flap2.start(time);
                flap2.stop(time + duration);

                // Add some noise for feather rustling
                const noiseBuffer = this.audioContext.createBuffer(1, this.audioContext.sampleRate * duration, this.audioContext.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * 0.1;
                }
                
                const noiseSource = this.audioContext.createBufferSource();
                const noiseGain = this.audioContext.createGain();
                noiseSource.buffer = noiseBuffer;
                noiseSource.connect(noiseGain);
                noiseGain.connect(this.audioContext.destination);
                
                noiseGain.gain.setValueAtTime(0.05, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + duration);
                
                noiseSource.start(time);
                noiseSource.stop(time + duration);
            }

            playScore() {
                this.playTone(600, 0.2, 'sine');
                setTimeout(() => this.playTone(800, 0.2, 'sine'), 100);
            }

            playCollision() {
                this.playTone(200, 0.5, 'sawtooth');
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.uiOverlay = document.getElementById('uiOverlay');
                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.highScoreDisplay = document.getElementById('highScoreDisplay');
                this.gameOverDisplay = document.getElementById('gameOverDisplay');
                this.finalScoreDisplay = document.getElementById('finalScoreDisplay');
                this.medalDisplay = document.getElementById('medalDisplay');
                this.instructionsDisplay = document.getElementById('instructionsDisplay');
                this.difficultyIndicator = document.getElementById('difficultyIndicator');
                this.pauseOverlay = document.getElementById('pauseOverlay');
                this.muteBtn = document.getElementById('muteBtn');
                this.pauseBtn = document.getElementById('pauseBtn');

                this.state = 'start'; // 'start', 'playing', 'gameOver', 'paused'
                this.score = 0;
                this.highScore = this.loadHighScore();
                this.bird = null;
                this.pipes = [];
                this.particles = [];
                this.clouds = [];
                this.pipeSpawnTimer = 0;
                this.pipeSpawnInterval = 120; // frames
                this.gapSize = 200; // Start with much larger gap
                this.groundHeight = 50;
                this.baseSpeed = 2; // Start slower
                this.currentSpeed = this.baseSpeed;
                this.difficultyLevel = 1;
                this.isPaused = false;
                this.newHighScore = false;
                this.screenShakeTimer = 0;

                this.audioManager = new AudioManager();

                this.setupCanvas();
                this.setupEventListeners();
                this.spawnInitialClouds();
                this.updateUI(); // Ensure initial UI state is set
                this.gameLoop();
            }

            setupCanvas() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                const container = document.getElementById('gameContainer');
                const maxWidth = Math.min(window.innerWidth - 40, 800);
                const maxHeight = Math.min(window.innerHeight - 40, 600);
                
                this.canvas.width = maxWidth;
                this.canvas.height = maxHeight;
                
                // Reinitialize bird position if game is running
                if (this.bird) {
                    this.bird.x = this.canvas.width * 0.2;
                    this.bird.y = this.canvas.height / 2;
                }
            }

            spawnInitialClouds() {
                for (let i = 0; i < 5; i++) {
                    this.clouds.push(new Cloud(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height * 0.6,
                        Math.random() * 20 + 15
                    ));
                }
            }

            setupEventListeners() {
                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        console.log('Space pressed, current state:', this.state);
                        this.handleInput();
                    } else if (e.code === 'KeyP') {
                        e.preventDefault();
                        this.togglePause();
                    }
                });

                // Touch/mouse controls
                this.canvas.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Canvas clicked, current state:', this.state);
                    this.handleInput();
                });
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    console.log('Canvas touched, current state:', this.state);
                    this.handleInput();
                });

                // Control buttons
                this.muteBtn.addEventListener('click', () => {
                    const muted = this.audioManager.toggleMute();
                    this.muteBtn.textContent = muted ? '🔇' : '🔊';
                });

                this.pauseBtn.addEventListener('click', () => this.togglePause());
            }

            handleInput() {
                // Initialize audio context on first user interaction
                if (this.audioManager.audioContext && this.audioManager.audioContext.state === 'suspended') {
                    this.audioManager.audioContext.resume();
                }

                if (this.isPaused) {
                    this.togglePause();
                    return;
                }

                switch (this.state) {
                    case 'start':
                        this.startGame();
                        break;
                    case 'playing':
                        this.bird.jump();
                        this.addParticles();
                        this.audioManager.playJump();
                        break;
                    case 'gameOver':
                        this.restartGame();
                        break;
                }
            }

            togglePause() {
                if (this.state === 'playing') {
                    this.isPaused = !this.isPaused;
                    this.pauseOverlay.style.display = this.isPaused ? 'flex' : 'none';
                    this.pauseBtn.textContent = this.isPaused ? '▶️' : '⏸️';
                }
            }

            startGame() {
                this.state = 'playing';
                this.score = 0;
                this.newHighScore = false;
                this.bird = new Bird(this.canvas.width * 0.2, this.canvas.height / 2);
                this.pipes = [];
                this.particles = [];
                this.pipeSpawnTimer = 0;
                this.currentSpeed = this.baseSpeed;
                this.gapSize = 200; // Start with much larger gap
                this.difficultyLevel = 1;
                this.isPaused = false;
                this.screenShakeTimer = 0;
                this.updateUI();
                this.updateDifficultyIndicator();
            }

            restartGame() {
                this.startGame();
            }

            addParticles() {
                for (let i = 0; i < 5; i++) {
                    this.particles.push(new Particle(this.bird.x, this.bird.y));
                }
            }

            loadHighScore() {
                return parseInt(localStorage.getItem('flappyBirdHighScore') || '0');
            }

            saveHighScore() {
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    this.newHighScore = true;
                    localStorage.setItem('flappyBirdHighScore', this.highScore.toString());
                }
            }

            getMedal() {
                if (this.score >= 100) return '🏆'; // Platinum
                if (this.score >= 50) return '🥇'; // Gold
                if (this.score >= 25) return '🥈'; // Silver
                if (this.score >= 10) return '🥉'; // Bronze
                return null;
            }

            update() {
                if (this.state !== 'playing' || this.isPaused) return;

                // Update screen shake
                if (this.screenShakeTimer > 0) {
                    this.screenShakeTimer--;
                }

                // Update bird
                this.bird.update();

                // Update pipes
                this.pipes.forEach(pipe => pipe.update());

                // Update clouds
                this.clouds.forEach(cloud => cloud.update());

                // Spawn new pipes
                this.pipeSpawnTimer++;
                if (this.pipeSpawnTimer >= this.pipeSpawnInterval) {
                    this.spawnPipe();
                    this.pipeSpawnTimer = 0;
                }

                // Spawn new clouds occasionally
                if (Math.random() < 0.005) {
                    this.clouds.push(new Cloud(
                        this.canvas.width + 50,
                        Math.random() * this.canvas.height * 0.6,
                        Math.random() * 20 + 15
                    ));
                }

                // Remove off-screen objects
                this.pipes = this.pipes.filter(pipe => !pipe.isOffScreen());
                this.clouds = this.clouds.filter(cloud => !cloud.isOffScreen());

                // Update particles
                this.particles.forEach(particle => particle.update());
                this.particles = this.particles.filter(particle => !particle.isDead());

                // Check collisions
                this.checkCollisions();

                // Update score and difficulty
                this.updateScore();
                this.updateDifficulty();
            }

            spawnPipe() {
                const gapY = Math.random() * (this.canvas.height - this.gapSize - this.groundHeight - 100) + 50;
                this.pipes.push(new Pipe(this.canvas.width, gapY, this.gapSize, this.currentSpeed));
            }

            updateDifficulty() {
                // Much more gradual difficulty progression
                const newLevel = Math.floor(this.score / 5) + 1; // Level up every 5 points instead of 10
                if (newLevel > this.difficultyLevel) {
                    this.difficultyLevel = newLevel;
                    // Slower speed increase - only 0.2 per level instead of 0.5
                    this.currentSpeed = this.baseSpeed + (this.difficultyLevel - 1) * 0.2;
                    this.updateDifficultyIndicator();
                }

                // Much more gradual gap size decrease - starts at 200, minimum 80
                // Only decreases every 10 points instead of 20, and by smaller amounts
                const newGapSize = Math.max(80, 200 - Math.floor(this.score / 10) * 8);
                if (newGapSize !== this.gapSize) {
                    this.gapSize = newGapSize;
                }
            }

            updateDifficultyIndicator() {
                this.difficultyIndicator.textContent = `Level ${this.difficultyLevel}`;
            }

            checkCollisions() {
                const birdBounds = this.bird.getBounds();

                // Ground collision
                if (this.bird.y + this.bird.radius >= this.canvas.height - this.groundHeight) {
                    this.gameOver();
                    return;
                }

                // Pipe collisions
                for (let pipe of this.pipes) {
                    const pipeBounds = pipe.getBounds();
                    
                    if (this.checkRectCollision(birdBounds, pipeBounds.top) ||
                        this.checkRectCollision(birdBounds, pipeBounds.bottom)) {
                        this.gameOver();
                        return;
                    }
                }
            }

            checkRectCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            updateScore() {
                for (let pipe of this.pipes) {
                    if (!pipe.scored && pipe.x + pipe.width < this.bird.x) {
                        pipe.scored = true;
                        this.score++;
                        this.audioManager.playScore();
                        this.updateUI();
                    }
                }
            }

            gameOver() {
                this.bird.die();
                this.audioManager.playCollision();
                this.screenShakeTimer = 10;
                this.saveHighScore();
                this.state = 'gameOver';
                this.updateUI();
            }

            updateUI() {
                // Get title and subtitle elements
                const titleElement = document.querySelector('.title');
                const subtitleElement = document.querySelector('.subtitle');
                
                // Hide all displays first
                this.scoreDisplay.style.display = 'none';
                this.highScoreDisplay.style.display = 'none';
                this.gameOverDisplay.style.display = 'none';
                this.finalScoreDisplay.style.display = 'none';
                this.medalDisplay.style.display = 'none';
                this.instructionsDisplay.style.display = 'none';

                switch (this.state) {
                    case 'start':
                        // Show title and subtitle on start screen
                        titleElement.style.display = 'block';
                        subtitleElement.style.display = 'block';
                        this.highScoreDisplay.style.display = 'block';
                        this.highScoreDisplay.textContent = `High Score: ${this.highScore}`;
                        this.instructionsDisplay.style.display = 'block';
                        break;
                    case 'playing':
                        // Hide title and subtitle during gameplay for clean view
                        titleElement.style.display = 'none';
                        subtitleElement.style.display = 'none';
                        this.scoreDisplay.style.display = 'block';
                        this.scoreDisplay.textContent = `Score: ${this.score}`;
                        break;
                    case 'gameOver':
                        // Keep title and subtitle hidden on game over
                        titleElement.style.display = 'none';
                        subtitleElement.style.display = 'none';
                        this.gameOverDisplay.style.display = 'block';
                        this.finalScoreDisplay.style.display = 'block';
                        this.finalScoreDisplay.textContent = `Final Score: ${this.score}`;
                        
                        // Show high score with special styling if new record
                        this.highScoreDisplay.style.display = 'block';
                        this.highScoreDisplay.textContent = `High Score: ${this.highScore}`;
                        if (this.newHighScore) {
                            this.highScoreDisplay.className = 'high-score new-high-score';
                        } else {
                            this.highScoreDisplay.className = 'high-score';
                        }
                        
                        // Show medal if earned
                        const medal = this.getMedal();
                        if (medal) {
                            this.medalDisplay.style.display = 'block';
                            this.medalDisplay.textContent = medal;
                        }
                        
                        this.instructionsDisplay.style.display = 'block';
                        this.instructionsDisplay.textContent = 'Press SPACE to Restart';
                        break;
                }
            }

            draw() {
                // Apply screen shake effect
                this.ctx.save();
                if (this.screenShakeTimer > 0) {
                    const shakeX = (Math.random() - 0.5) * 4;
                    const shakeY = (Math.random() - 0.5) * 4;
                    this.ctx.translate(shakeX, shakeY);
                }

                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw background gradient
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.7, '#98D8E8');
                gradient.addColorStop(1, '#90EE90');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw clouds
                this.clouds.forEach(cloud => cloud.draw(this.ctx));

                // Draw ground with texture
                this.ctx.fillStyle = '#8B4513';
                this.ctx.fillRect(0, this.canvas.height - this.groundHeight, this.canvas.width, this.groundHeight);

                // Draw grass pattern on ground
                this.ctx.fillStyle = '#228B22';
                this.ctx.fillRect(0, this.canvas.height - this.groundHeight - 5, this.canvas.width, 5);
                
                // Add grass texture
                this.ctx.strokeStyle = '#1F7A1F';
                this.ctx.lineWidth = 1;
                for (let x = 0; x < this.canvas.width; x += 10) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, this.canvas.height - this.groundHeight - 5);
                    this.ctx.lineTo(x + Math.random() * 4 - 2, this.canvas.height - this.groundHeight - 8);
                    this.ctx.stroke();
                }

                if (this.state === 'playing' || this.state === 'gameOver') {
                    // Draw pipes
                    this.pipes.forEach(pipe => pipe.draw(this.ctx, this.canvas.height));

                    // Draw particles
                    this.particles.forEach(particle => particle.draw(this.ctx));

                    // Draw bird
                    this.bird.draw(this.ctx);
                }

                this.ctx.restore();
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Initialize game when page loads
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
